[project]
name = "sideshift-scanner"
version = "0.1.0"
description = "Open-source MCP server for SideShift UGC creator analytics"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=1.2.0",
    "requests>=2.31.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
sideshift-scanner = "ugc_analytics.server:main"
sideshift-scanner-web = "ugc_analytics.webapp:main"

[tool.setuptools.package-data]
ugc_analytics = ["static/*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
